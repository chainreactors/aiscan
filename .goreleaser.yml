version: 2

project_name: cyber-harness

# This file is the build definition for the release workflow, which drives it
# one target at a time:
#
#     GOOS=<goos> GOARCH=<goarch> goreleaser build --id <id> --single-target
#
# `goreleaser build` keeps ldflags, build tags and the CGO switch in one place
# instead of spelling them out per profile in release-build.yml. All three distributions
# are pure Go and can be cross-compiled without a platform C toolchain.
#
# Packaging and publishing are deliberately absent. release-build.yml still
# zips README and docs together with UPX and a checksum, and go-release.yml
# still creates the GitHub Release from the curated docs/changelog.md, so
# `goreleaser release` is never run.
#
# The build tags come from editions.env, the same file the Makefile and the
# workflows read; nothing here restates them.

# Scratch space, not an output: every invocation copies the binary out with
# `-o`. It sits under .cache/ so the `--clean` each invocation needs — a second
# run refuses to start against a non-empty dist — cannot touch the dist/build
# directory the workflow collects artifacts in.
dist: .cache/goreleaser

builds:
  - id: cyber-scan
    main: ./cmd/aiscan
    binary: cyber-scan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    tags:
      - '{{ .Env.FULL_TAGS }}'
    ldflags:
      - -s -w -X github.com/chainreactors/cyber/pkg/config.Version={{ .Version }} -X main.productName=cyber-scan

  - id: cyber-web
    main: ./cmd/cyber-web
    binary: cyber-web
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    tags:
      - '{{ .Env.WEB_TAGS }}'
    ldflags:
      - -s -w -X github.com/chainreactors/cyber/pkg/config.Version={{ .Version }}

  - id: cyber-audit
    dir: audit
    main: ./cmd/cyber-audit
    binary: cyber-audit
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    tags:
      - arsenal_embed
    ldflags:
      - -s -w -X github.com/chainreactors/cyber/pkg/config.Version={{ .Version }}
