syntax = "proto3";
package cyber.jev;
import "aop/content.proto";
import "aop/event.proto";
import "decision/claim.proto";
option go_package = "github.com/chainreactors/cyber/exts/jev;jev";

message ClaimDefinition {
  string id = 1;
  decision.ClaimType type = 2;
  string context = 3;
  repeated string options = 4;
  string source_task_id = 5;
  reserved 6, 7;
}
message ReflexDefinition {
  string id = 1;
  string when = 2;
  string decide = 3;
  string observe = 4;
  repeated string claim_ids = 5;
  map<string, string> readers = 6;
  map<string, string> contracts = 7;
  uint32 api_version = 8;
  string qualification_json = 9;
  string manifest_json = 10;
  string blocker = 11;
}
message Boundary { string reason = 1; }
message Observation { string state_json = 1; string candidates_json = 2; }
message DecisionRequest {
  string request_id = 1;
  string purpose = 2;
  map<string, decision.Claim> claims = 3;
}
message DecisionResult {
  string request_id = 1;
  string purpose = 2;
  map<string, decision.Evaluation> evaluations = 3;
  int64 elapsed_ms = 4;
  string error = 5;
  aop.TokenUsage usage = 6;
}
message Takeover { ReflexDefinition definition = 1; }
message Dispatch { aop.ToolCall call = 1; string candidate_id = 2; bool read = 3; string effect_id = 4; string step_id = 5; uint32 occurrence = 6; }
message Result { aop.ToolResult result = 1; int64 elapsed_ms = 2; }
message Handoff { string reason = 1; string code = 2; string detail = 3; string effects_json = 4; string result_json = 5; }
message Generation {
  string kind = 1;
  string state = 2;
  string output = 3;
  string error = 4;
  int64 elapsed_ms = 5;
  aop.TokenUsage usage = 6;
  string request_id = 7;
  uint32 attempt = 8;
  string error_stage = 9;
  string requested_effort = 10;
  string parent_request_id = 11;
  string phase = 12;
}
message LibraryChange {
  string state = 1;
  ClaimDefinition claim = 2;
  ReflexDefinition reflex = 3;
  string replaced_reflex_id = 4;
  string reason = 5;
  string error_stage = 6;
}
// Runtime and asynchronous compilation share source correlation. Background
// events never imply that the source turn is still running.
message RuntimeEvent {
  string task_id = 1;
  string segment_id = 2;
  string previous_segment_id = 3;
  uint32 step = 4;
  string reflex_id = 5;
  string call_id = 6;
  bool background = 7;
  string boundary_id = 8;
  string claim_id = 9;
  oneof payload {
    Boundary boundary = 10;
    Observation observation = 11;
    DecisionRequest decision_request = 12;
    DecisionResult decision_result = 13;
    Takeover takeover = 14;
    Dispatch dispatch = 15;
    Result result = 16;
    Handoff handoff = 17;
    Generation generation = 18;
    LibraryChange library_change = 19;
  }
}
message GetLibraryRequest { string session_id = 1; }
message WaitIdleRequest { string session_id = 1; uint32 timeout_ms = 2; }
message WaitIdleResponse { bool settled = 1; string error = 2; }
message GetLibraryResponse {
  string mode = 1;
  string status = 2;
  reserved 3;
  string revision = 4;
  repeated ClaimDefinition claims = 5;
  repeated ReflexDefinition reflexes = 6;
  repeated ReflexDefinition candidates = 7;
  string learning = 8;
}
message ProtocolMessage {
  oneof message {
    GetLibraryRequest request = 1;
    GetLibraryResponse library = 2;
    WaitIdleRequest wait_idle = 3;
    WaitIdleResponse idle = 4;
  }
}
